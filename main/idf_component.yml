## idf_component.yml — ESP32-P4 Plane Radar dependencies

dependencies:
  idf: ">=5.3.0"

  ## Waveshare generic DSI panel driver.
  ## Covers the 4inch DSI LCD (C) — 720x720 round panel on the 4C board.
  waveshare/esp_lcd_dsi: ">=1.0.0"

  ## LVGL graphics library
  lvgl/lvgl: ">=9.2.0"

  ## mDNS — moved out of IDF core in v5.x
  espressif/mdns: ">=1.3.0"

  ## cJSON — moved out of IDF core in v5.x
  espressif/cjson: ">=1.7.18"
